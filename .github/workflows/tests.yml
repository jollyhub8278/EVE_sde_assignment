name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve_diagnostics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve_diagnostics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/eve_diagnostics_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/eve_diagnostics_test
      JWT_SECRET: test_jwt_secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      PAYMENT_WEBHOOK_SECRET: test_webhook_secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: EVE_SDE_Assignment
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: EVE_SDE_Assignment
        run: python -m pytest